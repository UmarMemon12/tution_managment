        <a href="batches.html" class="nav-item" data-nav="batches">

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar user-avatar-initials">AD</div>
          <div class="user-meta">
            <div class="name user-display-name">Administrator</div>
            <div class="role-pill role-admin user-role-badge">ADMIN</div>
          </div>
          <button class="logout-btn logout-trigger" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" title="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
          </button>
          <h1 class="page-heading">Weekly Class Timetable</h1>
        </div>
        <div class="topbar-right">
          <div id="connection-status-pill" class="system-status"></div>
          <button class="btn btn-secondary btn-sm" onclick="openSupabaseConfigModal()">
            ⚙️ Supabase API
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-left">
            <select id="filter-schedule-batch" class="form-control" style="width: auto; min-width: 220px;">
              <option value="">All Batches</option>
            </select>
          </div>

          <div class="toolbar-right">
            <button id="add-schedule-btn" class="btn btn-primary">
              + Add Class Schedule
            </button>
          </div>
        </div>

        <!-- Weekly Timetable Grid -->
        <div id="timetable-container" style="overflow-x: auto;">
          <div style="text-align: center; padding: 3rem;"><span class="spinner"></span> Loading timetable grid...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Schedule Slot Modal -->
  <div class="modal-backdrop" id="schedule-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="schedule-modal-title">Schedule Slot</h3>
        <button class="modal-close" onclick="closeModal('schedule-form-modal')">✕</button>
      </div>
      <form id="schedule-form">
        <div class="modal-body">
          <input type="hidden" id="schedule-db-id">

          <!-- Dynamic Conflict Warning Box -->
          <div id="schedule-conflict-warning" style="display: none; background: var(--danger-light); color: var(--danger-text); padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid #fecaca; font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

          <div class="form-group">
            <label class="form-label">Batch <span class="required">*</span></label>
            <select id="schedule-batch-select" class="form-control" required>
              <option value="">-- Choose Batch --</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Teacher</label>
            <select id="schedule-teacher-select" class="form-control">
              <option value="">-- Auto Assigned --</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Day of Week <span class="required">*</span></label>
            <select id="schedule-day-select" class="form-control" required>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Start Time <span class="required">*</span></label>
              <input type="time" id="schedule-start-time" class="form-control" value="16:00" required>
            </div>
            <div class="form-group">
              <label class="form-label">End Time <span class="required">*</span></label>
              <input type="time" id="schedule-end-time" class="form-control" value="17:30" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Room Number / Lab</label>
            <input type="text" id="schedule-room" class="form-control" placeholder="e.g. Room 101 or Lab B">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('schedule-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Schedule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/timetable.js"></script>
</body>
</html>
